SERIAL 0 115200
UI menu.c32
MENU TITLE ApexOS Gaming Edition (x86-64-v3 + NVIDIA + KDE)
MENU CLEAR
TIMEOUT 50
DEFAULT apexos

LABEL apexos
    MENU LABEL Boot ApexOS (NVIDIA Open + KDE Plasma Wayland)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% nvidia-drm.modeset=1 nvidia-drm.fbdev=1 zswap.enabled=0 transparent_hugepage=madvise nowatchdog nvme_load=YES quiet splash

LABEL apexos-safe
    MENU LABEL Boot ApexOS (Safe Graphics / Fallback)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% nomodeset nowatchdog nvme_load=YES
