#
# ApexOS pacman.conf
# Combines x86-64-v3 optimized repositories with Arch core/extra/multilib
# and a local repository for bundled AUR apps (Brave Browser).
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 10
ILoveCandy

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Local repo populated automatically by build-iso.sh (Brave Browser)
[apexos-local]
SigLevel = Optional TrustAll
Server = file:///tmp/apexos-local-repo

# x86-64-v3 Optimized Repositories
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Standard Arch Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
