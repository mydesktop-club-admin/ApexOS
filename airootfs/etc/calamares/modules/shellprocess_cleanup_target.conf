---
dontChroot: false
timeout: 180
script:
    - "rm -f /etc/sudoers.d/10-apexos-live"
    - "rm -f /etc/sddm.conf.d/10-apexos-wayland.conf"
    - "printf '%s\\n' '[General]' 'GreeterEnvironment=QT_QUICK_BACKEND=software' '' '[Theme]' 'Current=breeze' 'CursorTheme=breeze_cursors' > /etc/sddm.conf.d/10-apexos-wayland.conf"
    - "rm -f /usr/share/applications/install-apexos.desktop"
    - "rm -f /root/customize_airootfs.sh /etc/pacman.d/hooks/99-apexos-customize.hook"
    - "pacman -Rns --noconfirm cachyos-calamares mkinitcpio-archiso || true"
    - "pacman-key --init && pacman-key --populate archlinux cachyos || true"
    - "pacman -Sy --noconfirm || true"
    - "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true"
