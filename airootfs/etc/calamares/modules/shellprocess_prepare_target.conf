---
dontChroot: false
timeout: 120
script:
    - "printf '%s\\n' 'MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)' 'BINARIES=()' 'FILES=()' 'HOOKS=(base udev autodetect microcode modconf kms plymouth keyboard keymap consolefont block filesystems fsck)' 'COMPRESSION=\"zstd\"' > /etc/mkinitcpio.conf"
    - "printf '%s\\n' 'ALL_kver=\"/boot/vmlinuz-linux-cachyos\"' \"PRESETS=('default' 'fallback')\" 'default_image=\"/boot/initramfs-linux-cachyos.img\"' 'fallback_image=\"/boot/initramfs-linux-cachyos-fallback.img\"' 'fallback_options=\"-S autodetect\"' > /etc/mkinitcpio.d/linux-cachyos.preset"
    - "cp -f /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux-cachyos"
