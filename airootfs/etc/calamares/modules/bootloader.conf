---
efiBootLoader: "systemd-boot"
kernel: "/vmlinuz-linux-cachyos"
img: "/initramfs-linux-cachyos.img"
fallback: "/initramfs-linux-cachyos-fallback.img"
timeout: "2"
kernelLine: " (ApexOS Gaming Kernel)"
fallbackKernelLine: " (ApexOS Fallback)"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
kernelParams:
    - "nvidia-drm.modeset=1"
    - "nvidia-drm.fbdev=1"
    - "zswap.enabled=0"
    - "transparent_hugepage=madvise"
    - "nowatchdog"
    - "nvme_load=YES"
    - "quiet"
    - "splash"
