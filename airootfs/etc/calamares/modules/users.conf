---
defaultGroups:
    - wheel
    - video
    - audio
    - input
    - storage
    - optical
    - network
    - gamemode
    - lp
    - sys

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ApexOS"
presets:
    fullName:
        editable: true
    loginName:
        editable: true
