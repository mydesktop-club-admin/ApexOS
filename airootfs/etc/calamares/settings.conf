# ApexOS — Calamares Offline Graphical Installer Configuration
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:       prepare-target
    module:   shellprocess
    config:   shellprocess_prepare_target.conf
  - id:       cleanup-target
    module:   shellprocess
    config:   shellprocess_cleanup_target.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - shellprocess@prepare-target
      - initcpiocfg
      - initcpio
      - removeuser
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - bootloader
      - shellprocess@cleanup-target
      - umount

  - show:
      - finished

branding: apexos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
