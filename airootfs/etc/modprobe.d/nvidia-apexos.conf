# ApexOS — NVIDIA Open Kernel Module Optimizations for KDE Plasma Wayland & Gaming
# Enables DRM KMS + framebuffer console, preserves VRAM across sleep/resume,
# enables Page Attribute Table (PAT) for faster PCIe transfers, and enables Resizable BAR.

options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
options nvidia NVreg_UsePageAttributeTable=1
options nvidia NVreg_EnableResizableBar=1
options nvidia NVreg_EnableGpuFirmware=1
