# ApexOS — Low-Latency Gaming & Proton Kernel Sysctl Tweaks

# Fixes crashes in large Windows games via Proton (Star Citizen, Hogwarts Legacy, DayZ, etc.)
vm.max_map_count = 2147483642

# Disable split-lock mitigation penalty (huge FPS/frametime boost for Windows games in Wine/Proton)
kernel.split_lock_mitigate = 0

# ZRAM-optimized memory & writeback responsiveness
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# Low-latency gaming networking (CAKE queue discipline + BBR congestion control)
net.core.default_qdisc = cake
net.ipv4.tcp_congestion_control = bbr
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Reduce unnecessary kernel watchdog jitter
kernel.nmi_watchdog = 0
