title   ApexOS (NVIDIA Open + KDE Plasma Wayland)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% nvidia-drm.modeset=1 nvidia-drm.fbdev=1 zswap.enabled=0 transparent_hugepage=madvise nowatchdog nvme_load=YES quiet splash
